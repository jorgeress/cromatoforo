# MangoHud: HUD de rendimiento en juegos.
#
# POR QUE ESTA CONFIGURADO ASI
#   Este portatil es Optimus muxless: el panel lo pinta la Intel y la RTX 4060
#   solo entra por PRIME render offload. O sea que un juego puede arrancar
#   perfectamente EN LA INTEL sin decirte nada, y lo unico que notas es que va
#   mal. Por eso `gpu_name` esta activado: es la comprobacion de un vistazo de
#   que el offload funciono.
#
# COMO SE USA
#   No sale solo: arranca oculto (no_display) y se conmuta con Shift_R+F12.
#   Asi no estorba en una partida normal pero esta a un toque cuando dudas.

no_display
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2

################ LO QUE IMPORTA AQUI ################
# Si aqui pone "Intel" en vez de "NVIDIA", el juego NO esta en la dedicada:
# te falta `prime-run` en las opciones de lanzamiento.
gpu_name

################ GPU ################
gpu_stats
gpu_temp
gpu_core_clock
gpu_power
vram

################ CPU ################
cpu_stats
cpu_temp
cpu_mhz
ram

################ FOTOGRAMAS ################
fps
frametime
frame_timing
# 1% low: el numero que de verdad explica los tirones, mas que el FPS medio.
fps_metrics=avg,0.01

################ CONTEXTO ################
# Que capa de traduccion esta usando Proton (dxvk/vkd3d) y version de Vulkan.
engine_version
vulkan_driver
wine
# En portatil, saber si vas a bateria cambia como interpretas los numeros.
battery

################ ASPECTO ################
position=top-left
font_size=20
background_alpha=0.4
round_corners=8
table_columns=3
gpu_load_change
cpu_load_change
# Rojo por encima del 90% de uso, amarillo por encima del 60.
gpu_load_value=60,90
cpu_load_value=60,90

################ REGISTRO ################
# Para comparar dos configuraciones a posteriori en vez de a ojo.
output_folder=/home/j0r/.local/share/MangoHud
log_duration=30
autostart_log=0
