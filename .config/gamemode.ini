# gamemode.ini — configuracion de Feral GameMode para ESTE portatil.
#
# LEE ESTO ANTES DE CAMBIAR NADA. Aqui gamemode hace menos de lo que promete,
# y las dos decisiones raras son deliberadas.
#
# 1) EL GOBERNADOR SE QUEDA COMO ESTA (desiredgov=powersave).
#    La CPU va con intel_pstate en modo activo, donde "powersave" NO es lento:
#    sube a turbo maximo bajo carga en milisegundos. El gobernador
#    "performance" lo que hace es clavar min_perf_pct al 100%, o sea mantener
#    todos los nucleos a tope tambien cuando el juego no los necesita. En un
#    chasis delgado con una 4060 Max-Q eso le roba presupuesto termico y de
#    potencia a la GPU, que es quien suele ser el cuello de botella: el
#    resultado tipico es MENOS fps, no mas.
#
# 2) renice e ioprio en 0 A SABIENDAS.
#    gamemoded corre como servicio de usuario y el RLIMIT_NICE del gestor de
#    usuario es 0 (`ulimit -e`), asi que no puede poner prioridades negativas.
#    Pedirselo solo llena el log de avisos. Para que funcionase de verdad hay
#    que tocar DefaultLimitNICE en /etc/systemd/user.conf, que es una decision
#    de sistema, no de este fichero.
#
# ENTONCES, ¿PARA QUE SIRVE GAMEMODE AQUI? Para dos cosas concretas:
#
#   a) split_lock_mitigate. El kernel lo tiene en 1
#      (`sysctl kernel.split_lock_mitigate`). Esa mitigacion penaliza
#      brutalmente a los procesos que hacen atomicos desalineados, cosa que
#      varios juegos de Windows bajo Proton hacen, y se nota como tirones
#      periodicos que ningun ajuste grafico arregla. gamemode lo pone a 0
#      mientras juegas y lo restaura al salir.
#   b) Inhibir el salvapantallas.
#
#   La (a) necesita permiso: sin estar en el grupo `gamemode` falla con
#   "Not authorized" (lo hace pkexec, ver /usr/share/polkit-1/rules.d/
#   gamemode.rules). Es la unica razon por la que merece la pena entrar en ese
#   grupo, porque el gobernador ya lo hemos desactivado arriba a proposito:
#       sudo usermod -aG gamemode $USER     # y cerrar sesion y volver a entrar
#
# NO hay seccion [gpu]: con apply_gpu_optimisations puesto a cualquier cosa que
# no sea la cadena literal "accept-responsibility", gamemode escupe un ERROR y
# `gamemoded -t` falla. Sin la seccion, el comportamiento es el mismo (apagado)
# y sin ruido.

[general]
desiredgov=powersave
renice=0
ioprio=0
inhibit_screensaver=1
softrealtime=off

[custom]
start=/usr/bin/notify-send -a GameMode -t 2000 "GameMode activado"
end=/usr/bin/notify-send -a GameMode -t 2000 "GameMode desactivado"
