; Autogenerado por pywal en ~/.cache/wal/spicetify-color.ini. NO editar a mano.
; Lo copia a ~/.config/spicetify/Themes/pywal/color.ini el script
; ~/.config/hypr/scripts/spotify-theme.sh
;
; Formato de spicetify: claves fijas, color en hex SIN almohadilla. De ahi el
; .strip de pywal. Poner "#210e18" aqui hace que spicetify ignore la clave.
[pywal]
text               = {color7.strip}
subtext            = {color4.strip}
sidebar-text       = {color7.strip}
main               = {color0.strip}
sidebar            = {color0.lighten(4).strip}
player             = {color0.lighten(4).strip}
card               = {color0.lighten(8).strip}
shadow             = {color0.darken(50).strip}
selected-row       = {color4.strip}
button             = {color4.strip}
button-active      = {color6.strip}
button-disabled    = {color8.strip}
tab-active         = {color0.lighten(12).strip}
notification       = {color2.strip}
notification-error = {color1.strip}
misc               = {color5.strip}
