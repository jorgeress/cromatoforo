# Autogenerado por pywal. NO editar a mano.
# Fuente: ~/.config/wal/templates/starship.toml
# Destino: ~/.cache/wal/starship.toml

add_newline = true
command_timeout = 1000

format = """
$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold fg:{color6})"
error_symbol = "[❯](bold fg:{color1})"
vimcmd_symbol = "[❮](bold fg:{color3})"

[directory]
style = "bold fg:{color4}"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:{color1}"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Pictures" = " "
"Videos" = " "
"Music" = " "
".config" = " "

[git_branch]
symbol = " "
style = "fg:{color5}"
format = "[on ](fg:{color8})[$symbol$branch]($style) "

[git_status]
style = "fg:{color3}"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "= "
ahead = "⇡${{count}} "
behind = "⇣${{count}} "
diverged = "⇕⇡${{ahead_count}}⇣${{behind_count}} "
untracked = "?${{count}} "
stashed = "󰏗 "
modified = "!${{count}} "
staged = "+${{count}} "
renamed = "»${{count}} "
deleted = "✘${{count}} "

[cmd_duration]
min_time = 2000
style = "fg:{color3}"
format = "[󱎫 $duration]($style) "

[python]
symbol = " "
style = "fg:{color6}"
format = "[$symbol($version )(\\($virtualenv\\) )]($style)"

[nodejs]
symbol = " "
style = "fg:{color2}"
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
style = "fg:{color1}"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:{color6}"
format = "[$symbol($version )]($style)"
