# hyprlock usa hyprlang (NO lua). Colores desde pywal.
source = ~/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    grace = 2
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <i>Contraseña...</i>
    check_color = $accent2
    fail_color = $urgent
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = Hola, $USER
    color = $fg
    font_size = 14
    position = 0, -130
    halign = center
    valign = center
}
