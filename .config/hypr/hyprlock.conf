# hyprlock usa hyprlang (NO lua). Colores desde pywal.
source = ~/.cache/wal/colors-hyprlock.conf

general {
    hide_cursor = true
    # OJO: grace y no_fade_in NO son opciones de config en hyprlock 0.9.6
    # (dan "config option does not exist" y se ignoran). Son flags de CLI,
    # y por eso los lanzadores llaman a `hyprlock --grace 2`.
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.011
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
}

# ── Avatar ─────────────────────────────────────────────────
# Deja tu foto en ~/.face (PNG o JPG, cuadrada). Si el fichero no
# existe hyprlock avisa por log y sigue funcionando: no bloquea nada.
image {
    monitor =
    path = ~/.face
    size = 130
    rounding = -1
    border_size = 3
    border_color = $accent
    position = 0, 300
    halign = center
    valign = center
}

# ── Hora ───────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $fg
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d de %B')"
    color = $accent
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# ── Campo de contraseña ────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text =
    check_color = $accent2
    fail_color = $urgent
    fail_text = <i>Incorrecta ($ATTEMPTS)</i>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = Hola, $USER
    color = $fg
    font_size = 14
    position = 0, -130
    halign = center
    valign = center
}

# ── Batería (arriba a la derecha) ──────────────────────────
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/scripts/lock-battery.sh
    color = $accent
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -40, -30
    halign = right
    valign = top
}

# ── Reproducción (abajo al centro) ─────────────────────────
# Sale vacío cuando no hay nada sonando.
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/lock-media.sh
    color = $accent2
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = bottom
}
